name: Publicar

# Dispara na tag. A tag é a decisão de publicar — não o merge, não o horário.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Módulo Go (pela tag, sem registro)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Publicar sem passar pelo portão é publicar no escuro. O CI já roda
      # isto em push e PR; aqui roda de novo porque a tag pode apontar para um
      # commit que ninguém abriu em PR.
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

      # A tag e a constante `Version` tem de dizer o mesmo número.
      #
      # Go não tem manifesto, então a constante é a única coisa que o pacote
      # sabe sobre a própria versão — e é o primeiro dado que o suporte pede.
      # Sem esta conferência, `v0.3.0` publicaria um módulo que se apresenta
      # como outra coisa, e no Go isso não se desfaz: uma versão que o proxy
      # indexou fica indexada.
      - name: A constante Version é a da tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP 'const Version = "\K[^"]+' aronline.go)

          echo "tag=$tag  aronline.go=$version"

          if [ "$tag" != "$version" ]; then
            echo "a tag diz $tag e a constante diz $version"
            exit 1
          fi

      # Go não tem registro nem token: a TAG é a publicação. O proxy
      # (proxy.golang.org) indexa o módulo na primeira vez que alguém pedir
      # aquela versão. Não há Trusted Publishing a configurar aqui — não
      # porque falte, mas porque não existe credencial neste caminho.
      #
      # O aquecimento abaixo é o que faz a versão aparecer sem esperar o
      # primeiro `go get` de alguém.
      - name: Avisar o proxy do módulo
        run: |
          GOPROXY=proxy.golang.org go list -m \
            "github.com/AR-Online/ar-online-go@${GITHUB_REF_NAME}"

      - name: Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
