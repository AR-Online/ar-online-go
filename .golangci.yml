version: "2"

# `misspell` fica de fora: ele so conhece ingles, e a prosa daqui e em
# portugues — ele acusou "Eles" como erro de "Eels". Ortografia ja e coberta
# pelo codespell, que carrega a lista de excecoes pt-BR.
linters:
  default: standard
  enable:
    - bodyclose # resposta HTTP não fechada vaza conexão no processo do parceiro
    - errcheck
    - errorlint # `errors.Is/As` no lugar de comparação e type assertion
    - gocritic
    - godot
    - gosec
    - nilerr
    - noctx # requisição sem context é requisição que não dá para cancelar
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      # `check-blank` fica DESLIGADO de proposito. `_ = x()` e o jeito que a
      # linguagem oferece para dizer "estou ignorando este erro, e sei disso":
      # ligar a checagem e depois escrever `_ =` em todo lugar seria brigar
      # com o proprio idioma. O que nao pode passar e o erro ignorado em
      # SILENCIO — e disso o check-type-assertions e o resto do conjunto dao
      # conta.
      check-blank: false
    gocritic:
      enabled-tags: [diagnostic, performance, style]
    revive:
      rules:
        - name: exported
          # Isto é uma biblioteca pública: identificador exportado sem
          # comentário é identificador que o parceiro descobre lendo o fonte.
          arguments: [checkPrivateReceivers, disableStutteringCheck]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
